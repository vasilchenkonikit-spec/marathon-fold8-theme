name: Build Marathon Fold8 v4.1

on:
  workflow_dispatch:
  push:
    branches: [ v4-auto-installer ]
    paths-ignore:
      - dist-v4/**
      - dist-v41/**

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore exact v4 project payload
        run: |
          { cat v4src/part_01.b64 v4src/part_02a.b64 v4src/part_02b.b64 v4src/part_03.b64 v4src/part_04.b64 v4src/part_05.b64 v4src/part_06.b64 v4src/part_07.b64 v4src/part_08.b64 v4src/part_09.b64 v4src/part_10.b64 v4src/part_11.b64 v4src/part_12.b64 v4src/part_13.b64 v4src/part_14.b64; } > payload.b64
          test "$(wc -c < payload.b64)" -eq 231220
          base64 -d payload.b64 > source_project_v4_min.zip
          echo '7125a5c3587298a62d6b20da4d0df66f55523a41732b456004f562bd3d3c6268  source_project_v4_min.zip' | sha256sum -c -
          unzip -t source_project_v4_min.zip
          rm -rf v4build && mkdir v4build
          unzip -q source_project_v4_min.zip -d v4build
      - name: Patch Android resources
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('v4build/app/src/main/res/values/strings.xml')
          s=p.read_text()
          if 'name="accessibility_desc"' not in s:
              s=s.replace('</resources>','<string name="accessibility_desc">Automatically applies Marathon settings after explicit permission.</string>\n</resources>')
          if 'name="wallpaper_name"' not in s:
              s=s.replace('</resources>','<string name="wallpaper_name">Marathon 93 Adaptive Wallpaper</string>\n</resources>')
          p.write_text(s)
          PY
      - name: Apply v4.1 responsive Marathon Home
        run: |
          base64 -d v4patch/LauncherActivity_v412.java.gz.b64 | gzip -d > v4build/app/src/main/java/com/nv/marathontheme/LauncherActivity.java
          python3 - <<'PY'
          from pathlib import Path
          p=Path('v4build/app/build.gradle')
          s=p.read_text()
          s=s.replace("applicationId 'com.nv.marathontheme.v4'","applicationId 'com.nv.marathontheme.v41'")
          s=s.replace('versionCode 40','versionCode 41')
          s=s.replace("versionName '4.0'","versionName '4.1'")
          p.write_text(s)
          PY
          sed -i 's/Marathon Fold 8/Marathon Fold 8 v4.1/g' v4build/app/src/main/AndroidManifest.xml
          sed -i 's/AUTO INSTALLER v4/AUTO INSTALLER v4.1/g' v4build/app/src/main/java/com/nv/marathontheme/SetupActivity.java
          grep -n 'applicationId\|versionCode\|versionName' v4build/app/build.gradle
          grep -n 'class LauncherActivity' v4build/app/src/main/java/com/nv/marathontheme/LauncherActivity.java
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        run: |
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build v4.1 APK
        working-directory: v4build
        run: gradle :app:assembleDebug --stacktrace
      - name: Verify APK
        run: |
          APK=v4build/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          /usr/local/lib/android/sdk/build-tools/35.0.0/apksigner verify --verbose "$APK"
          cp "$APK" Marathon_Fold8_Auto_Installer_v4_1.apk
          sha256sum Marathon_Fold8_Auto_Installer_v4_1.apk > SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Marathon-Fold8-Auto-v4-1
          path: |
            Marathon_Fold8_Auto_Installer_v4_1.apk
            SHA256.txt
      - name: Publish APK
        run: |
          mkdir -p dist-v41
          cp Marathon_Fold8_Auto_Installer_v4_1.apk dist-v41/
          cp SHA256.txt dist-v41/
          printf 'Built from %s at %s UTC\n' "$GITHUB_SHA" "$(date -u '+%Y-%m-%d %H:%M:%S')" > dist-v41/BUILD_SUCCESS.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist-v41
          git commit -m 'Publish Marathon Fold8 v4.1 APK [skip ci]' || true
          git push || true
