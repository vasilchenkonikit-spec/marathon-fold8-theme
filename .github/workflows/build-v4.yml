name: Build Marathon Fold8 v4

on:
  workflow_dispatch:
  push:
    branches: [ v4-auto-installer ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore final v4 project payload
        run: |
          echo '297e19fbed6237b0838d395422e6c645f6142968c6d6bbd26c4aad21f19a74d5  v4src/part_02a.b64' | sha256sum -c -
          echo '00da9066ad5468529bc603328528a00e22ad322c796c64f24e27f716a4c2e3da  v4src/part_02b.b64' | sha256sum -c -
          { cat v4src/part_01.b64 v4src/part_02a.b64 v4src/part_02b.b64 v4src/part_03.b64 v4src/part_04.b64 v4src/part_05.b64 v4src/part_06.b64 v4src/part_07.b64 v4src/part_08.b64 v4src/part_09.b64 v4src/part_10.b64 v4src/part_11.b64 v4src/part_12.b64 v4src/part_13.b64 v4src/part_14.b64; } | tr -cd 'A-Za-z0-9+/=' > payload.b64
          test "$(wc -c < payload.b64)" -eq 231220
          base64 -d payload.b64 > source_project_v4_min.zip
          echo '7125a5c3587298a62d6b20da4d0df66f55523a41732b456004f562bd3d3c6268  source_project_v4_min.zip' | sha256sum -c -
          unzip -t source_project_v4_min.zip
          rm -rf v4build && mkdir v4build
          unzip -q source_project_v4_min.zip -d v4build
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        run: |
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build v4 APK
        working-directory: v4build
        run: gradle :app:assembleDebug --stacktrace
      - name: Verify APK
        run: |
          APK=v4build/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          /usr/local/lib/android/sdk/build-tools/35.0.0/apksigner verify --verbose "$APK"
          cp "$APK" Marathon_Fold8_Auto_Installer_v4.apk
          sha256sum Marathon_Fold8_Auto_Installer_v4.apk > SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Marathon-Fold8-Auto-v4
          path: |
            Marathon_Fold8_Auto_Installer_v4.apk
            SHA256.txt
      - name: Publish APK
        run: |
          mkdir -p dist-v4
          cp Marathon_Fold8_Auto_Installer_v4.apk dist-v4/
          cp SHA256.txt dist-v4/
          printf 'Built from %s at %s UTC\n' "$GITHUB_SHA" "$(date -u '+%Y-%m-%d %H:%M:%S')" > dist-v4/BUILD_SUCCESS.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist-v4
          git commit -m 'Publish Marathon Fold8 v4 APK [skip ci]' || true
          git push || true
