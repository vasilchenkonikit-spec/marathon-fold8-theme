name: Build Marathon APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - BUILD_FAILURE.log

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack Android project
        shell: bash
        run: |
          set -o pipefail
          unzip -o source_project.zip 2>&1 | tee unzip.log

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -o pipefail
          {
            echo "ANDROID_HOME=$ANDROID_HOME"
            echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
            sdkmanager --version
            yes | sdkmanager --licenses || true
            sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          } 2>&1 | tee sdk.log

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Pillow
        shell: bash
        run: |
          set -o pipefail
          python3 -m pip install --disable-pip-version-check Pillow 2>&1 | tee pip.log

      - name: Generate Marathon assets
        shell: bash
        run: |
          set -o pipefail
          python3 tools/generate_assets.py 2>&1 | tee generate.log
          echo "Generated resources:"
          find app/src/main/res -maxdepth 2 -type f | sort | tail -n 120

      - name: Build installable APK
        shell: bash
        run: |
          set -o pipefail
          gradle :app:assembleDebug --stacktrace --info 2>&1 | tee build.log

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Marathon_Theme_Installer.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Marathon-Theme-Installer
          path: Marathon_Theme_Installer.apk

      - name: Persist failure diagnostics to repository
        if: failure()
        shell: bash
        run: |
          {
            echo "MARATHON APK BUILD FAILURE"
            echo "UTC: $(date -u)"
            echo "SHA: $GITHUB_SHA"
            echo
            echo "=== FILES ==="
            find . -maxdepth 4 -type f | sort | head -n 250
            for f in unzip.log sdk.log pip.log generate.log build.log; do
              echo
              echo "=== $f ==="
              if [ -f "$f" ]; then tail -n 350 "$f"; else echo "not created"; fi
            done
          } > BUILD_FAILURE.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BUILD_FAILURE.log
          git commit -m "Save failed APK build diagnostics [skip ci]" || true
          git push || true
