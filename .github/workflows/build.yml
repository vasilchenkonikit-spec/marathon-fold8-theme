name: Build Marathon Fold8 v3

on:
  workflow_dispatch:
  push:
    branches: [ v3-production ]
    paths-ignore:
      - dist-v3/**
      - BUILD_FAILURE_V3.log

permissions:
  contents: write

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore Android project
        run: |
          unzip -o source_project.zip
          python3 patch_v3.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        run: |
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate theme assets
        run: |
          python3 -m pip install --disable-pip-version-check Pillow
          python3 tools/generate_assets.py
          cp app/src/main/res/drawable-nodpi/wallpaper_lock.jpg app/src/main/res/drawable-nodpi/wallpaper_cover.jpg
          cp app/src/main/res/drawable-nodpi/wallpaper_home.jpg app/src/main/res/drawable-nodpi/wallpaper_inner.jpg

      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Marathon_Fold8_Theme_v3.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Marathon-Fold8-Theme-v3
          path: Marathon_Fold8_Theme_v3.apk

      - name: Publish APK
        if: success()
        run: |
          mkdir -p dist-v3
          cp Marathon_Fold8_Theme_v3.apk dist-v3/Marathon_Fold8_Theme_v3.apk
          printf 'Built from %s at %s UTC\n' "$GITHUB_SHA" "$(date -u '+%Y-%m-%d %H:%M:%S')" > dist-v3/BUILD_SUCCESS.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist-v3
          git commit -m "Publish Marathon Fold8 v3 APK [skip ci]" || true
          git push || true

      - name: Save diagnostics
        if: failure()
        run: |
          {
            echo "MARATHON FOLD8 V3 BUILD FAILURE"
            echo "UTC: $(date -u)"
            echo "SHA: $GITHUB_SHA"
            find app/src/main -maxdepth 5 -type f | sort | head -n 250
          } > BUILD_FAILURE_V3.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BUILD_FAILURE_V3.log
          git commit -m "Save v3 build diagnostics [skip ci]" || true
          git push || true
