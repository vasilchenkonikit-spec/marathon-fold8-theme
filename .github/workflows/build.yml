name: Build Marathon Auto v2.1

on:
  workflow_dispatch:
  push:
    branches: [ v2-auto ]
    paths-ignore:
      - dist-v21/**
      - BUILD_FAILURE_V21.log

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack launcher project
        run: unzip -o source_project.zip 2>&1 | tee unzip-v21.log

      - name: Apply v2.1 auto-setup patch
        run: python3 patch_v21.py 2>&1 | tee patch-v21.log

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Pillow
        run: python3 -m pip install --disable-pip-version-check Pillow

      - name: Generate Marathon visual assets
        run: python3 tools/generate_assets.py 2>&1 | tee generate-v21.log

      - name: Build APK
        shell: bash
        run: |
          set -o pipefail
          gradle :app:assembleDebug --stacktrace --info 2>&1 | tee build-v21.log

      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Marathon_Auto_Installer_v2_1.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Marathon-Auto-Installer-v2.1
          path: Marathon_Auto_Installer_v2_1.apk

      - name: Publish successful APK to branch
        if: success()
        run: |
          mkdir -p dist-v21
          cp Marathon_Auto_Installer_v2_1.apk dist-v21/Marathon_Auto_Installer_v2_1.apk
          printf 'Built from %s at %s UTC\n' "$GITHUB_SHA" "$(date -u '+%Y-%m-%d %H:%M:%S')" > dist-v21/BUILD_SUCCESS.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist-v21
          git commit -m "Publish Marathon Auto v2.1 APK [skip ci]" || true
          git push || true

      - name: Persist failure diagnostics
        if: failure()
        run: |
          {
            echo "MARATHON AUTO V2.1 BUILD FAILURE"
            echo "UTC: $(date -u)"
            echo "SHA: $GITHUB_SHA"
            for f in unzip-v21.log patch-v21.log generate-v21.log build-v21.log; do
              echo; echo "=== $f ==="
              if [ -f "$f" ]; then tail -n 500 "$f"; else echo "not created"; fi
            done
          } > BUILD_FAILURE_V21.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BUILD_FAILURE_V21.log
          git commit -m "Save v2.1 build diagnostics [skip ci]" || true
          git push || true
