name: Build Marathon APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack Android project
        run: unzip -o source_project.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Pillow
        run: python3 -m pip install --disable-pip-version-check Pillow

      - name: Generate Marathon assets
        run: python3 tools/generate_assets.py

      - name: Build installable APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Marathon_Theme_Installer.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Marathon-Theme-Installer
          path: Marathon_Theme_Installer.apk
