name: Build Marathon APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - BUILD_FAILURE.log

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack Android project
        shell: bash
        run: |
          set -o pipefail
          unzip -o source_project.zip 2>&1 | tee unzip.log

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -o pipefail
          {
            echo "ANDROID_HOME=$ANDROID_HOME"
            echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
            sdkmanager --version
            yes | sdkmanager --licenses || true
            sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          } 2>&1 | tee sdk.log

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Pillow
        shell: bash
        run: |
          set -o pipefail
          python3 -m pip install --disable-pip-version-check Pillow 2>&1 | tee pip.log

      - name: Rebuild valid Marathon source artwork
        shell: bash
        run: |
          python3 - <<'PY'
          from PIL import Image, ImageDraw, ImageFont, ImageFilter
          from pathlib import Path
          import math, os

          W,H = 941,1672
          lime=(215,255,0)
          ink=(16,21,21)
          navy=(7,18,23)
          cyan=(0,216,229)
          magenta=(240,42,152)

          im=Image.new('RGB',(W,H),lime)
          d=ImageDraw.Draw(im)

          # Large dark/teal planetary body, matching the established Marathon HUD direction.
          cx,cy=575,500
          r=360
          planet=Image.new('RGBA',(W,H),(0,0,0,0))
          pd=ImageDraw.Draw(planet)
          pd.ellipse((cx-r,cy-r,cx+r,cy+r),fill=(9,58,60,255))
          pd.ellipse((cx-r+85,cy-r+45,cx+r-55,cy+r-90),fill=(15,113,108,170))
          pd.arc((cx-r-55,cy-r+40,cx+r+55,cy+r-15),190,355,fill=(235,255,22,210),width=5)
          planet=planet.filter(ImageFilter.GaussianBlur(1.2))
          im=Image.alpha_composite(im.convert('RGBA'),planet).convert('RGB')
          d=ImageDraw.Draw(im)

          # HUD reticle and framing.
          for rr,w in [(150,4),(235,3),(320,2)]:
              d.ellipse((cx-rr,cy-rr,cx+rr,cy+rr),outline=ink,width=w)
          d.line((cx-410,cy,cx+330,cy),fill=ink,width=3)
          d.line((cx,cy-400,cx,cy+390),fill=ink,width=3)
          d.rectangle((48,75,250,84),fill=ink)
          d.rectangle((48,102,165,111),fill=cyan)
          d.rectangle((48,129,115,138),fill=magenta)

          # Edge ticks and technical blocks.
          for i in range(9):
              y=250+i*130
              d.line((28,y,58,y),fill=ink,width=3)
              d.line((W-58,y,W-28,y),fill=ink,width=3)
          d.rounded_rectangle((60,1180,881,1510),radius=28,outline=ink,width=4)
          for i,frac in enumerate([.82,.62,.93,.48]):
              yy=1260+i*55
              d.rectangle((110,yy,760,yy+10),fill=(177,205,0))
              d.rectangle((110,yy,110+int(650*frac),yy+10),fill=ink if i<3 else magenta)
          d.rectangle((770,1215,830,1230),fill=cyan)

          # Use a system font if present.
          candidates=['/usr/share/fonts/truetype/dejavu/DejaVuSansMono-Bold.ttf','/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf']
          fp=next((x for x in candidates if os.path.exists(x)),None)
          font_big=ImageFont.truetype(fp,42) if fp else ImageFont.load_default()
          font_mid=ImageFont.truetype(fp,22) if fp else ImageFont.load_default()
          d.text((60,175),'TAU CETI IV',fill=ink,font=font_big)
          d.text((60,225),'RUNNER // NV-01',fill=ink,font=font_mid)
          d.text((60,258),'SYSTEM ONLINE',fill=cyan,font=font_mid)
          d.text((110,1208),'BIOSYNCHRONIZATION // 93%',fill=ink,font=font_mid)
          d.text((60,1565),'MARATHON PROTOCOL',fill=ink,font=font_big)

          out=Path('tools/source_art.jpg')
          im.save(out,'JPEG',quality=90,optimize=True)
          print('Rebuilt valid source artwork:',out,out.stat().st_size,'bytes')
          PY

      - name: Generate Marathon assets
        shell: bash
        run: |
          set -o pipefail
          python3 tools/generate_assets.py 2>&1 | tee generate.log
          echo "Generated resources:"
          find app/src/main/res -maxdepth 2 -type f | sort | tail -n 120

      - name: Build installable APK
        shell: bash
        run: |
          set -o pipefail
          gradle :app:assembleDebug --stacktrace --info 2>&1 | tee build.log

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Marathon_Theme_Installer.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Marathon-Theme-Installer
          path: Marathon_Theme_Installer.apk

      - name: Persist failure diagnostics to repository
        if: failure()
        shell: bash
        run: |
          {
            echo "MARATHON APK BUILD FAILURE"
            echo "UTC: $(date -u)"
            echo "SHA: $GITHUB_SHA"
            echo
            echo "=== FILES ==="
            find . -maxdepth 4 -type f | sort | head -n 250
            for f in unzip.log sdk.log pip.log generate.log build.log; do
              echo
              echo "=== $f ==="
              if [ -f "$f" ]; then tail -n 350 "$f"; else echo "not created"; fi
            done
          } > BUILD_FAILURE.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BUILD_FAILURE.log
          git commit -m "Save failed APK build diagnostics [skip ci]" || true
          git push || true
